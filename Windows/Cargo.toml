[package]
name = "npp-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
npp-editor-core = { path = "../crates/editor-core" }
npp-compat = { path = "../crates/npp-compat" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true


